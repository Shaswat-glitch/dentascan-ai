name: Sync Backend to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set up Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Clone the Hugging Face Space using the secret token
          git clone https://Shaswat-glitch:$HF_TOKEN@huggingface.co/spaces/Shaswat-glitch/dentascan-api hf_space
          
          # Copy everything from the backend folder into the HF Space folder
          cp -r backend/* hf_space/
          
          # Push the changes back to Hugging Face
          cd hf_space
          git add .
          git commit -m "Auto-deployed backend from GitHub Actions" || echo "No changes to commit"
          git push
